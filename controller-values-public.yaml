## Labels to apply to all resources
##
#commonLabels: {} main one
#
#fargate_use
commonLabels:  
  namespace: ingress-nginx 

# scmhash: abc123
# myLabel: aakkmd

controller:
  # -- Use a `DaemonSet` or `Deployment`
  kind: Deployment
  
  livenessProbe:
    httpGet:
      # should match container.healthCheckPath
      path: "/healthz"
      port: 10254
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 5
  readinessProbe:
    httpGet:
      # should match container.healthCheckPath
      path: "/healthz"
      port: 10254
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3


  # -- Path of the health check endpoint. All requests received on the port defined by
  # the healthz-port parameter are forwarded internally to this path.
  healthCheckPath: "/healthz"

  podAnnotations:
    ad.datadoghq.com/controller.check_names: '["nginx","nginx_ingress_controller"]'
    ad.datadoghq.com/controller.init_configs: '[{},{}]'
    ad.datadoghq.com/controller.instances: '[{"nginx_status_url": "http://%%host%%:18080/nginx_status"},{"prometheus_url":"http://%%host%%:10254/metrics"}]'
    ad.datadoghq.com/controller.logs: '[{ "source": "nginx-ingress-controller","service": "ingress-controller" }]'

  replicaCount: 1
  minAvailable: 1
  metrics:
    port: 10254
    # if this port is changed, change healthz-port: in extraArgs: accordingly
    enabled: true

  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: map-migrated=migLOR6U1QEIP
      service.beta.kubernetes.io/aws-load-balancer-name: faceapi-prod
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-type : "external"
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
      service.beta.kubernetes.io/load-balancer-source-ranges: 173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.24.0.0/14,131.0.72.0/22,104.16.0.0/13,172.64.0.0/13,34.233.54.0/32,75.119.144.190/32,176.241.95.18/32 
      #service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip  #enable only if you have fargate installed
      # prometheus.io/scrape: "true"
      # prometheus.io/port: "10254"
      #

